spring.application.name=sanefly-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/Sanefly
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=8081

# JPA / Hibernate — validate only, schema is owned by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/sanefly
